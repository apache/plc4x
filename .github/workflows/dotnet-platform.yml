name: .NET Platform Compatibility

on:
  push:
    branches: [develop, plc4net]
    paths: [plc4net/**, .github/workflows/dotnet-platform.yml]
  pull_request:
    branches: [develop, plc4net]
    paths: [plc4net/**, .github/workflows/dotnet-platform.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore plc4net/plc4net.sln
      - name: Build
        run: dotnet build plc4net/plc4net.sln --configuration Debug --no-restore --no-incremental
      - name: Test
        run: dotnet test plc4net/plc4net.sln --configuration Debug --no-build
      - name: Check vulnerable dependencies
        run: dotnet list plc4net/plc4net.sln package --vulnerable --include-transitive
