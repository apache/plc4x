name: 'Go Platform Test Report'

on:
  workflow_run:
    workflows: [ 'Go Platform compatibility' ]
    types:
      - completed

env:
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}

jobs:
  report:
    strategy:
      matrix:
        java: [ 21 ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: dorny/test-reporter@e17be7e0078fc00f61965f3b4032f1e1fdc7fcfb  # v2.4.0
        with:
          artifact: "golang-test-report-${{ matrix.os }}"
          name: "Golang Tests (OS: ${{ matrix.os }})"
          path: '**/*.xml'
          reporter: java-junit