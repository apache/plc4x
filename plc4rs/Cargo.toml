[package]
name = "plc4rs"
version = "0.1.0"
edition = "2021"
authors = ["Apache PLC4X Team <dev@plc4x.apache.org>"]
description = "Rust implementation of the Apache PLC4X project"
license = "Apache-2.0"
repository = "https://github.com/apache/plc4x"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.43.0", features = ["full"] }
thiserror = "1.0.69"
tracing = "0.1.41"
bytes = "1.10.0"
nom = "7.1.3"
async-trait = "0.1.77"
socket2 = "0.5.8"

[dev-dependencies]
tokio-test = "0.4.3"
tracing-subscriber = "0.3.18" 
