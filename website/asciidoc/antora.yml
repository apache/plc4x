name: plc4x
version: 'pre-release'
prerelease: True
title: PLC4X
start_page: users:index.adoc
nav:
- modules/ROOT/nav.adoc
- modules/users/nav.adoc
- modules/developers/nav.adoc
asciidoc:
  attributes:
    # These two are kept in sync with the version of the Maven project by the
    # "sync-antora-version" execution in website/pom.xml, which runs in the "validate"
    # phase of every build - don't edit them by hand, a build will overwrite it again.
    # They have to stay in this file (rather than being passed to Antora globally),
    # because the playbook builds the released branches from git alongside this one and
    # every branch has to keep documenting its own version.
    current-last-released-version: '1.0.0-SNAPSHOT'
    current-full-version: '1.0.0'

